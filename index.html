<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- soukromá stránka: vyhledávače ji nemají indexovat ani archivovat -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="bingbot" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<!-- stránka smí načítat jen vlastní soubory a mluvit jen s přihlášením a databází Firebase (wasm a blob: potřebuje Konvertor) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com http://127.0.0.1:9099 http://127.0.0.1:8080; base-uri 'none'; form-action 'none'" />
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Hub" />
<title>Hub</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="ikona-192.png" type="image/png" />
<link rel="apple-touch-icon" href="ikona-180.png" />
<!-- ?v= u souborů musí odpovídat VERSION v app.js (aby se po úpravě nenačetla stará kopie) -->
<link rel="stylesheet" href="app.css?v=1.4" />
<link rel="modulepreload" href="firebase.js?v=1.4" />
</head>
<body>
<div id="root"><div class="boot"><div class="spin"></div></div></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=1.4"></script>
</body>
</html>
